project:
  name: credit-risk-platform
  version: "1.0.0"

random_seed: 42

# ────────────────────────────────────────────────────────────────
# Data
# ────────────────────────────────────────────────────────────────
# ────────────────────────────────────────────────────────────────
# Spark session (read by credit_risk/utils/spark.py — affects EVERY pipeline)
# ────────────────────────────────────────────────────────────────
spark:
  # local[1] per the 3.8 GB VM constraint: in local mode driver and executor
  # are the SAME JVM, so every concurrent task competes for driver_memory.
  # More cores means more peak heap, not more throughput, on this box.
  master: local[1]
  driver_memory: 2g
  # NOTE: ignored in local mode (no separate executor JVM). Kept for the day
  # this runs on YARN/K8s.
  executor_memory: 1g
  # 50 suits the 30M-row precompute aggregations. For the small joined master
  # (~307k rows) it over-partitions — lower it to 8–16 if the ablate phase
  # looks task-overhead bound.
  shuffle_partitions: 50
  default_parallelism: 8

data:
  target_column: TARGET
  id_column: SK_ID_CURR

  split:
    train_ratio: 0.70
    val_ratio:   0.15
    test_ratio:  0.15
    stratify_by: TARGET

  # Multi-table integration — all 7 Home Credit tables
  tables:
    application:
      path: data/01_raw/application_train.csv
      primary_key: SK_ID_CURR
      required: true
      expected_rows: 307511    # verified by the ablation precompute phase
    bureau:
      path: data/01_raw/bureau.csv
      primary_key: SK_ID_BUREAU
      foreign_key: SK_ID_CURR
      required: false
    bureau_balance:
      path: data/01_raw/bureau_balance.csv
      foreign_key: SK_ID_BUREAU
      required: false
    previous_application:
      path: data/01_raw/previous_application.csv
      primary_key: SK_ID_PREV
      foreign_key: SK_ID_CURR
      required: false
    pos_cash_balance:
      path: data/01_raw/POS_CASH_balance.csv
      foreign_key: SK_ID_PREV
      required: false
    installments_payments:
      path: data/01_raw/installments_payments.csv
      foreign_key: SK_ID_PREV
      required: false
    credit_card_balance:
      path: data/01_raw/credit_card_balance.csv
      foreign_key: SK_ID_PREV
      required: false

# ────────────────────────────────────────────────────────────────
# Feature engineering
# ────────────────────────────────────────────────────────────────
features:
  missing_threshold: 0.5     # drop cols >50% null
  numeric_imputation: median
  categorical_imputation: most_frequent

  categorical_columns:
    - NAME_CONTRACT_TYPE
    - CODE_GENDER
    - FLAG_OWN_CAR
    - FLAG_OWN_REALTY
    - NAME_INCOME_TYPE
    - NAME_EDUCATION_TYPE
    - NAME_FAMILY_STATUS
    - NAME_HOUSING_TYPE
    - OCCUPATION_TYPE
    - ORGANIZATION_TYPE

# ────────────────────────────────────────────────────────────────
# Models
# ────────────────────────────────────────────────────────────────
models:
  default_model: gbt

  imbalance:
    method: class_weight   # class_weight | undersample | smote

  logistic:
    maxIter: 100
    regParam: 0.01
    elasticNetParam: 0.0
    standardization: true

  random_forest:
    numTrees: 100
    maxDepth: 10
    maxBins: 64
    subsamplingRate: 0.8
    featureSubsetStrategy: sqrt

  gbt:
    maxIter: 100
    maxDepth: 5
    stepSize: 0.1
    subsamplingRate: 0.8

  tuning:
    enabled: true
    num_folds: 3
    metric: areaUnderROC
    grids:

      gbt:
        maxDepth: [3, 5, 7]
        maxIter: [50, 100]
      random_forest:
        numTrees: [50, 100]
        maxDepth: [5, 10]
      logistic:
        regParam: [0.001, 0.01, 0.1]
        elasticNetParam: [0.0, 0.5]

# ────────────────────────────────────────────────────────────────
# Cross-validation (T1.4) — read by pipelines/cv_pipeline.py
# ────────────────────────────────────────────────────────────────
cv:
  # k=5 trains each fold on ~68% of master, close to the ~70% the Production
  # run used, and gives a half-width factor t*/sqrt(k) of 1.242 against 2.484
  # at k=3 — better on both comparability and precision.
  k_folds: 5
  confidence_level: 0.95
  n_deciles: 10
  # Pool is train.parquet + val.parquet; test.parquet is never read, so it
  # stays a clean hold-out. Folds are stratified on data.target_column and
  # ordered by xxhash64(id, random_seed) — see credit_risk/cv/study.py.

# ────────────────────────────────────────────────────────────────
# Segment validation (P0.4) — read by pipelines/segment_pipeline.py
# ────────────────────────────────────────────────────────────────
# Slices the T1.4 out-of-fold predictions. No training, no Spark.
# Support floors: with a ~8% default rate a group needs ~600 rows to hold 50
# defaults, and an AUC built on fewer moves by whole points when one default
# changes — below these, a group is suppressed instead of reported.
segments:
  min_rows: 1000
  min_positives: 50
  n_bins: 5          # quantile bands; edges come from the data, not from config
  dimensions:
    - name: contract_type
      column: NAME_CONTRACT_TYPE
      kind: categorical
      description: "Cash vs revolving loans — also the QRRE mapping in README 8.2"
    - name: gender
      column: CODE_GENDER
      kind: categorical
      sensitive: true
      description: "CODE_GENDER is an input feature (features.categorical_columns), so the model sees it"
    - name: age_group
      column: DAYS_BIRTH
      kind: quantile
      transform: days_to_years
      description: "Age in years = -DAYS_BIRTH/365.25, cut at data quintiles"
    - name: income_group
      column: AMT_INCOME_TOTAL
      kind: quantile
      description: "AMT_INCOME_TOTAL cut at data quintiles"

# ────────────────────────────────────────────────────────────────
# Baseline comparison (P0.3) — read by pipelines/baseline_pipeline.py
# ────────────────────────────────────────────────────────────────
# Decomposes "is the multi-table pipeline worth it?" into the feature set vs
# the model class. Reuses the persisted ablation split so the numbers sit
# beside README §12.1. EXT_SOURCE_1 is ~56% null and the real pipeline drops
# it via features.missing_threshold — logit_ext2_ext3 is the contrast.
baseline:
  variants:
    - name: rule_ext_mean
      model: rule
      features: [EXT_SOURCE_1, EXT_SOURCE_2, EXT_SOURCE_3]
      description: "No training: rank by the mean of available EXT_SOURCE"
    - name: logit_ext2_ext3
      model: logistic
      features: [EXT_SOURCE_2, EXT_SOURCE_3]
      description: "Only the EXT_SOURCE columns that pass missing_threshold"
    - name: logit_ext_all3
      model: logistic
      features: [EXT_SOURCE_1, EXT_SOURCE_2, EXT_SOURCE_3]
      description: "All three EXT_SOURCE, median-imputed"
    - name: gbt_ext_all3
      model: gbt
      features: [EXT_SOURCE_1, EXT_SOURCE_2, EXT_SOURCE_3]
      description: "Same three features, same model as the real pipeline"

# ────────────────────────────────────────────────────────────────
# Cost-based cut-off (P1.1) — read by pipelines/threshold_pipeline.py
# ────────────────────────────────────────────────────────────────
# Turns the PD score into a decision. Sweeps thresholds over the T1.4
# out-of-fold predictions; no training, no Spark.
threshold:
  # ASSUMPTION, and the one that moves the answer most: expected margin on a
  # PERFORMING loan as a fraction of EAD over its life, net of funding and
  # operating cost. Nothing in Home Credit measures this, so several values are
  # swept and a conclusion only counts if it survives all of them.
  # Break-even PD = m / (m + LGD), so with LGD 0.45 these give
  # 0.0426 / 0.1000 / 0.1509 / 0.2105.
  margin_rates: [0.02, 0.05, 0.08, 0.12]
  grid_points: 200     # candidate thresholds, placed at score quantiles
  curve_points: 40     # points kept in the JSON curve, to stay readable
  plateau_n_se: 1.0    # thresholds within this many PAIRED standard errors
                       # of the best count as indistinguishable from it
  # The policy being compared against comes from risk.segmentation.thresholds
  # plus the decision rule in streaming/spark_streaming.py:156-158 — not
  # duplicated here, so there is one source of truth.

# ────────────────────────────────────────────────────────────────
# MLflow
# ────────────────────────────────────────────────────────────────
mlflow:
  tracking_uri: http://mlflow:5000
  experiment_name: credit_risk_platform
  registered_model_name: credit_risk_gbt
  log_artifacts: true
  log_models: true

# ────────────────────────────────────────────────────────────────
# Risk (Basel II)
# ────────────────────────────────────────────────────────────────
risk:
  woe_iv:
    n_bins: 10
    min_iv_threshold: 0.02

  segmentation:
    pd_column: pd_score
    thresholds:
      low: 0.10
      medium: 0.20
      high: 0.35

  expected_loss:
    lgd_method: fixed
    # ASSUMPTION: 0.45 is the Basel II *Foundation IRB corporate* value, borrowed
    # here as a constant. Retail IRB has no foundation approach (retail is A-IRB
    # only), so this stands in for an own-estimate LGD model we do not have.
    lgd_fixed: 0.45
    ead_column: AMT_CREDIT   # ASSUMPTION: proxy for EAD, no CCF for undrawn limits

  # Basel II IRB capital — retail risk-weight function (ASRF).
  # Regulatory formula constants, not tunable business knobs. See
  # credit_risk/risk/capital.py and README §8.2.
  capital:
    confidence_level: 0.999      # Basel II: 99.9th percentile, 1-year horizon
    pd_floor: 0.0003             # Basel II: 0.03% PD floor
    pd_cap: 0.9999               # numerical guard, Phi^-1(1) is undefined
    rwa_multiplier: 12.5         # RWA = K x 12.5 x EAD (8% minimum capital ratio)

    qrre_correlation: 0.04       # §329 qualifying revolving retail
    other_retail_r_min: 0.03     # §328 R ranges 0.03 (high PD) ...
    other_retail_r_max: 0.16     #      ... to 0.16 (low PD)
    other_retail_k_factor: 35.0  #      exponential weight exp(-35 x PD)

    # ASSUMPTION (documented in README §8.2): contract type -> exposure class.
    # Revolving loans -> QRRE, everything else -> other retail.
    contract_type_column: NAME_CONTRACT_TYPE
    qrre_contract_types: ["Revolving loans"]

    # Legacy EL-multiple heuristic. ASSUMPTION, not Basel. Reported in the JSON
    # only as a cross-check to quantify how far it lands from the IRB formula;
    # it is never the headline number.
    rule_of_thumb:
      ul_multiple_of_el: 3.0
      ec_multiple_of_ul: 1.5

  stress_testing:
    scenarios:
      baseline:       {pd_multiplier: 1.0,  lgd_multiplier: 1.0,  description: "Current portfolio state"}
      mild_recession: {pd_multiplier: 1.5,  lgd_multiplier: 1.1,  description: "GDP -2%, unemployment +3pp"}
      severe:         {pd_multiplier: 2.5,  lgd_multiplier: 1.3,  description: "2008-style crisis"}
      black_swan:     {pd_multiplier: 4.0,  lgd_multiplier: 1.5,  description: "Tail event, 99.9% percentile"}

# ────────────────────────────────────────────────────────────────
# Monitoring
# ────────────────────────────────────────────────────────────────
monitoring:
  drift:
    psi_threshold_warning: 0.10
    psi_threshold_alert:   0.25
    ks_pvalue_threshold:   0.05
    monitored_features:
      - AMT_CREDIT
      - AMT_INCOME_TOTAL
      - DAYS_BIRTH
      - DAYS_EMPLOYED
      - EXT_SOURCE_2
      - EXT_SOURCE_3

  performance:
    auc_degradation_threshold: 0.03   # alert if AUC drops > 3pp

# ────────────────────────────────────────────────────────────────
# API
# ────────────────────────────────────────────────────────────────
api:
  rate_limit: "100/minute"
  request_timeout: 30
  enable_shap: true        # set false for max throughput
  max_payload_size_kb: 50

# ────────────────────────────────────────────────────────────────
# AWS
# ────────────────────────────────────────────────────────────────
aws:
  region: us-east-1
  s3_bucket: credit-risk-platform-models
  lambda_function: credit-risk-scorer
  lambda_memory_mb: 1024
  lambda_timeout_s: 30
hdfs:
  enabled: true
  base_path: "hdfs://localhost:9000/user/vietphuongnguyen/credit_risk"
  raw_path: "hdfs://localhost:9000/user/vietphuongnguyen/credit_risk/raw"
  processed_path: "hdfs://localhost:9000/user/vietphuongnguyen/credit_risk/processed"
  results_path: "hdfs://localhost:9000/user/vietphuongnguyen/credit_risk/results"
